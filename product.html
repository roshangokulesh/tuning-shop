<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.cdnfonts.com/css/winob" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/base45" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    @import url('https://fonts.cdnfonts.com/css/winob');
    @import url('https://fonts.cdnfonts.com/css/base45');

    /* =========================
       GLOBAL
    ========================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        overflow-x: hidden;
        scroll-behavior: smooth;
    }

    body {
        width: 100%;
        min-height: 100vh;

        background-image: url("./Car-engine-modifications.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center top;
        background-attachment: fixed;

        overflow-x: hidden;
    }


    /* =========================
       NAVBAR
    ========================= */

    .d1 {
        background-color: rgba(14, 13, 13, 0.483);
        color: rgb(255, 1, 1);

        box-shadow: 5px 5px 20px;

        width: calc(100% - 40px);
        max-width: 1050px;

        min-height: 70px;

        margin: 10px auto;

        border-radius: 45px;

        transition: 0.6s ease;
    }

    .d1:hover {
        width: calc(100% - 30px);
        max-width: 1100px;
    }


    ul {
        display: flex;

        width: 100%;
        min-height: 70px;

        padding: 15px 25px;

        list-style: none;

        align-items: center;
        justify-content: space-between;

        gap: 20px;

        font-size: clamp(18px, 2vw, 25px);

        text-shadow: 2px 2px 13px white;
    }


    /* Remove old fixed spacing */

    .space {
        margin-left: 0;
    }

    .spacer {
        margin-right: 0;
    }


    .g17 {
        text-shadow: none;

        font-size: clamp(28px, 3vw, 45px);

        font-weight: 1000;

        font-family: fantasy;

        margin-left: 0;
    }


    a {
        color: white;
        text-decoration: none;

        transition: 0.5s;
    }

    a:hover {
        color: red;
    }

    .g17:hover {
        color: white;
    }


    /* =========================
       HERO
    ========================= */

    .d2 {
        width: 100%;

        min-height: 500px;

        display: flex;

        align-items: center;
        justify-content: center;

        padding: 40px 20px;
    }


    h2 {
        color: rgb(253, 252, 252);

        margin: 0;

        text-align: center;

        font-size: clamp(35px, 5vw, 65px);

        font-family: 'winob', sans-serif;

        text-shadow: 3px 3px 15px black;
    }


    /* =========================
       PRODUCT TITLE
    ========================= */

    .d5 {
        width: 100%;

        padding: 40px 20px;

        margin: 0;

        text-align: center;

        font-family: 'Base45', sans-serif;
    }

    .d5 h1 {
        font-size: clamp(35px, 5vw, 60px);

        text-decoration: underline;

        text-underline-offset: 8px;
    }


    /* =========================
       PRODUCTS
    ========================= */

    .product {
        width: min(1200px, 95%);

        margin: 0 auto 50px auto;

        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 35px;

        justify-items: center;

        align-items: start;
    }


    .rowproduct2 {
        width: min(1200px, 95%);

        margin: 0 auto 80px auto;

        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 35px;

        justify-items: center;

        align-items: start;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .d6,
    .d7 {
        width: 100%;
        max-width: 320px;

        margin: 0;

        border: 5px solid rgba(0, 0, 0, 0.289);

        text-align: center;

        padding: 20px 15px;

        border-radius: 10%;

        box-shadow: 2px 2px 10px;

        background-color: rgba(255, 255, 255, 0.92);

        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease;
    }


    .d6:hover,
    .d7:hover {
        transform: translateY(-8px);

        box-shadow: 5px 8px 20px rgba(0, 0, 0, 0.35);
    }


    /* =========================
       CARD
    ========================= */

    .card {
        width: 100% !important;

        max-width: 290px;

        margin: auto;
    }


    .card-img-top {
        width: 100% !important;

        height: 250px !important;

        object-fit: cover;

        border-radius: 5px;
    }


    .card-body {
        padding-top: 15px;
    }


    .card-body p {
        font-size: 20px;

        font-weight: 600;

        margin-bottom: 12px;
    }


    /* =========================
       QUANTITY BUTTONS
    ========================= */

    .button1,
    .button2 {
        padding: 6px 12px;

        font-size: 18px;

        cursor: pointer;

        border: 1px solid black;

        border-radius: 5px;

        background: white;

        transition: 0.3s;
    }


    .button1:hover,
    .button2:hover {
        background: black;

        color: white;
    }


    #quantity,
    #quantity1,
    #quantity2,
    #quantity3,
    #quantity4,
    #quantity5 {
        display: inline-block;

        min-width: 30px;

        font-size: 18px;

        font-weight: bold;
    }


    /* =========================
       PRICE BOX
    ========================= */

    #v1,
    .card-body > div:not(.button1) {
        max-width: 150px;

        margin: 12px auto !important;

        padding: 10px !important;
    }


    #v1 h6,
    .card-body h6 {
        margin: 0;

        font-size: 20px !important;
    }


    /* =========================
       LAPTOP
    ========================= */

    @media (max-width: 1100px) {

        .product,
        .rowproduct2 {
            width: 92%;

            gap: 25px;
        }

        .d6,
        .d7 {
            max-width: 300px;
        }
    }


    /* =========================
       TABLET / SMALL LAPTOP
    ========================= */

    @media (max-width: 900px) {

        .d1 {
            width: calc(100% - 30px);

            border-radius: 35px;
        }

        ul {
            gap: 12px;

            padding: 15px 20px;

            font-size: clamp(16px, 2.5vw, 21px);
        }

        .g17 {
            font-size: 32px;
        }


        .d2 {
            min-height: 420px;
        }


        .product,
        .rowproduct2 {
            grid-template-columns: repeat(2, 1fr);

            width: 90%;

            gap: 25px;
        }

        .d6,
        .d7 {
            max-width: 320px;
        }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        body {
            background-attachment: scroll;

            background-position: center top;
        }


        /* Navbar */

        .d1 {
            width: calc(100% - 20px);

            min-height: auto;

            margin: 10px auto;

            border-radius: 25px;
        }


        ul {
            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 12px;

            padding: 18px;
        }


        .g17 {
            font-size: 35px;
        }


        /* Hero */

        .d2 {
            min-height: 350px;

            padding: 30px 15px;
        }


        h2 {
            font-size: clamp(30px, 9vw, 45px);
        }


        /* Product title */

        .d5 {
            padding: 30px 15px;
        }

        .d5 h1 {
            font-size: 40px;
        }


        /* Products one by one */

        .product,
        .rowproduct2 {
            width: 90%;

            grid-template-columns: 1fr;

            gap: 30px;

            margin-bottom: 50px;
        }


        .d6,
        .d7 {
            width: 100%;

            max-width: 330px;

            margin: auto;
        }


        .card {
            max-width: 100%;
        }


        .card-img-top {
            height: 250px !important;
        }
    }


    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 400px) {

        .d1 {
            width: calc(100% - 15px);
        }


        ul {
            gap: 10px;

            padding: 15px;
        }


        .g17 {
            font-size: 30px;
        }


        .d2 {
            min-height: 300px;
        }


        h2 {
            font-size: 30px;
        }


        .d5 h1 {
            font-size: 35px;
        }


        .d6,
        .d7 {
            padding: 15px 10px;
        }


        .card-img-top {
            height: 220px !important;
        }
    }
</style>
</head>

<body>
    <header>
        <div class="d1">
            <ul>
                <li><a class="g17" href="#">G17</a></li>
                <li><a class="space" href="./index.html">Home</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./product.html">Product</a></li>

            </ul>
        </div>
    </header>
    <div class="d2">

    </div>

    <!-- product -->
    <div class="d5">

    </div>

    <div data-aos="zoom-in" class="product">
        <div class="d6">

                    <p>Spoiler</p>
                    <button class="button1" id="b1" onclick="minus()">-</button>
                     <span id="quantity">1</span>
                    <button class="button2" id="b2" onclick="plus()">+</button>
                    <div id="v1" style="border: 1px dotted black; border-radius: 10px; padding: 12px 0px;margin: 5px 70px;">
                        <h6 id="ha" style="font-size: larger;">$100</h6>
                    </div>
                </div>
            </div>
        </div>
        <!-- 2nd pr -->
        <div class="d6">
            <div class="card" style="width: 18rem;">
                <img src="./diffuser" class="card-img-top" alt="..." height="250" width="230">
                <div class="card-body">
                    <p>Diffuser</p>
                    <button class="button1" id="b1" onclick="minus1()">-</button>
                     <span id="quantity1">1</span>
                    <button class="button2" id="b2" onclick="plus1()">+</button>
                    <div style="border: 1px dotted black; border-radius: 10px; padding: 10px 0px;margin: 5px 70px;">
                         <h6 id="hb" style="font-size: larger;">$100</h6>
                    </div>
                </div>
            </div>
        </div>
        <!-- 3rd pr -->
        <div class="d6">
            <div class="card" style="width: 18rem;">
                <img src="./this.webp" class="card-img-top" alt="..." height="250" width="230">
                <div class="card-body">
                    <p>steering</p>
                    <button class="button1" id="b1" onclick="minus2()">-</button>
                     <span id="quantity2">1</span>
                    <button class="button2" id="b2" onclick="plus2()">+</button>
                    <div style="border: 1px dotted black; border-radius: 10px; padding: 10px 0px;margin: 5px 70px;">
                         <h6 id="hc" style="font-size: larger;">$100</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <br>
    <!-- 4rth pr -->
    <div data-aos="zoom-in" class="rowproduct2">
        <div class="d7">
            <div class="card" style="width: 18rem;">
                <img src="./exhaust.webp" class="card-img-top" alt="..." height="250" width="230">
                <div class="card-body">
                    <p>Exhauster</p>
                    <button class="button1" id="b1" onclick="minus3()">-</button>
                    <span id="quantity3">1</span>
                    <button class="button2" id="b2" onclick="plus3()">+</button>
                    <div style="border: 1px dotted black; border-radius: 10px; padding: 10px 0px;margin: 5px 70px;">
                        <h6 id="hd" style="font-size: larger;">$100</h6>
                    </div>
                </div>
            </div>
        </div>
        <!-- 5th pr -->
        <div class="d7">
            <div class="card" style="width: 18rem;">
                <img src="./wrap.webp" class="card-img-top" alt="..." height="250" width="230">
                <div class="card-body">
                    <p>Wrap</p>
                    <button class="button1" id="b1" onclick="minus4()">-</button>
                    <span id="quantity4">1</span>
                    <button class="button2" id="b2" onclick="plus4()">+</button>
                    <div style="border: 1px dotted black; border-radius: 10px; padding: 10px 0px;margin: 5px 70px;">
                        <h6 id="he" style="font-size: larger;">$100</h6>
                    </div>
                </div>
            </div>
        </div>
        <!-- 6th pr -->
        <div class="d7">
            <div class="card" style="width: 18rem;">
                <img src="./tint.webp" class="card-img-top" alt="..." height="250" width="230">
                <div class="card-body">
                    <p>Tint</p>
                    <button class="button1" id="b1" onclick="minus5()">-</button>
                    <span id="quantity5">1</span>
                    <button class="button2" id="b2" onclick="plus5()">+</button>
                    <div style="border: 1px dotted black; border-radius: 10px; padding: 10px 0px;margin: 5px 70px;">
                        <h6 id="hf" style="font-size: larger;">$100</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    AOS.init();

    let quantity = 1;
    let quantity1 = 1;
    let quantity2 = 1;
    let quantity3 = 1;
    let quantity4 = 1;
    let quantity5 = 1;

const unitPrice = 100;

function plus() {
    quantity++;

    document.getElementById("quantity").innerText = quantity;

    let total = unitPrice * quantity;

    document.getElementById("ha").innerText ="$ "+ total;
}
function minus() {
    if (quantity > 1) {
        quantity--;

        document.getElementById("quantity").innerText = quantity;

        let total = unitPrice * quantity;

        document.getElementById("ha").innerText = "$ "+ total;
    }
}

    // 5thpr

}
    function plus4() {
    quantity4++;

    document.getElementById("quantity4").innerText = quantity4;

    let total = unitPrice * quantity4;

    document.getElementById("he").innerText ="$ "+ total;
}
    // 6thpr
    function minus5() {
    if (quantity5 > 1) {
        quantity5--;

        document.getElementById("quantity5").innerText = quantity5;

        let total = unitPrice * quantity5;

        document.getElementById("hf").innerText = "$ "+ total;

}
    function plus5() {

}
</script>

</html>
